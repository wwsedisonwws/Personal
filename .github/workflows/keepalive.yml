# Supabase 免费版闲置 7 天会自动暂停项目。
# 收租是月度动作，中间二十几天没人访问，必然触发 —— 到时候月初打开网站全是报错，
# 得自己登后台点 Restore，每个月来一次。
#
# 这个任务每周一自动访问一次，让项目保持醒着。
#
# 连接参数直接从 config.js 读。那两个值本来就是公开的（anon key 设计如此，
# 任何人打开网页都看得到），没必要再存一份 GitHub Secret 让人多做一步设置。
name: keepalive

on:
  schedule:
    - cron: '17 3 * * 1'   # 每周一 03:17 UTC（马来西亚时间 11:17）
  workflow_dispatch:        # 也可在 Actions 页面手动触发

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 生产站和试验站是两个 Supabase 项目，各自会睡着，所以两个都要 ping。
      # 试验站还没建（lab/config.js 还是占位符）时跳过它，不算失败。
      - name: 列出要 ping 的项目
        id: cfg
        run: |
          node -e '
            const out = [];
            for (const [name, path] of [["生产站","./config.js"],["试验站","./lab/config.js"]]) {
              global.window = {};
              try { require(path); } catch { console.error(`${name}：没有 ${path}，跳过`); continue; }
              const c = window.SUPABASE_CONFIG || {};
              // 跟网页同一套判断：验网址格式，而不是找某句占位符
              if (!/^https:\/\/[a-z0-9-]+\.supabase\.co/i.test(String(c.url || "").trim())) {
                console.error(`${name}：${path} 还没填好，跳过`);
                continue;
              }
              out.push(`${name} ${c.url} ${c.anonKey}`);
            }
            if (!out.length) { console.error("两个都没填好，无事可做"); process.exit(78); }
            console.log("targets<<EOF");
            console.log(out.join("\n"));
            console.log("EOF");
          ' >> "$GITHUB_OUTPUT"

      - name: Ping Supabase
        run: |
          fail=0
          while read -r name url key; do
            [ -z "$name" ] && continue
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
              -H "apikey: $key" "$url/rest/v1/")
            # 401 也算活着 —— 服务在跑，只是这个端点要求更完整的凭证。
            case "$code" in
              200|401|404) echo "✅ $name 醒着（HTTP $code）" ;;
              *) echo "❌ $name 异常（HTTP $code），可能已暂停，去 Supabase 后台看看"; fail=1 ;;
            esac
          done <<'TARGETS'
          ${{ steps.cfg.outputs.targets }}
          TARGETS
          exit $fail
